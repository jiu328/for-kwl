<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>专属浪漫 - To 孔文丽 ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            overflow: hidden;
            background: radial-gradient(circle at center, #1f0515 0%, #060108 100%);
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none; /* 锁死手机微信原生下拉回弹 */
        }

        /* 开场点击引导遮罩（解决手机浏览器禁止自动播放音频限制） */
        #welcome-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, rgba(35, 6, 24, 0.94) 0%, rgba(5, 1, 6, 0.99) 100%);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            cursor: pointer;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        #welcome-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .pulse-heart {
            font-size: 64px;
            animation: heartPulse 1.3s infinite ease-in-out;
            filter: drop-shadow(0 0 25px #ff2a6d);
            margin-bottom: 20px;
        }
        .welcome-title {
            color: #fff;
            font-size: 22px;
            letter-spacing: 4px;
            margin-bottom: 12px;
            text-shadow: 0 0 15px #ff2a6d;
        }
        .welcome-sub {
            color: rgba(255, 182, 193, 0.9);
            font-size: 14px;
            letter-spacing: 2px;
            padding: 10px 26px;
            border: 1px solid rgba(255, 133, 162, 0.5);
            border-radius: 999px;
            background: rgba(255, 42, 109, 0.18);
            box-shadow: 0 0 20px rgba(255, 42, 109, 0.3);
        }

        @keyframes heartPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.18); }
        }

        /* 右上角悬浮音乐开关 */
        #music-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255, 42, 109, 0.25);
            border: 1.5px solid rgba(255, 182, 193, 0.6);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            cursor: pointer;
            z-index: 50;
            box-shadow: 0 0 15px rgba(255, 42, 109, 0.5);
        }
        #music-btn.playing {
            animation: spinRecord 4s linear infinite;
        }
        @keyframes spinRecord {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 照片点击放大预览弹窗 */
        #photo-modal {
            position: fixed;
            inset: 0;
            background: rgba(8, 1, 6, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 90;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        #photo-modal.active {
            opacity: 1;
            visibility: visible;
        }
        .modal-card {
            background: #fff8fa;
            padding: 14px 14px 22px 14px;
            border-radius: 14px;
            box-shadow: 0 0 40px rgba(255, 42, 109, 0.6);
            max-width: 86vw;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: scale(0.85);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #photo-modal.active .modal-card {
            transform: scale(1);
        }
        .modal-card img {
            max-width: 76vw;
            max-height: 58vh;
            border-radius: 8px;
            object-fit: cover;
        }
        .modal-caption {
            margin-top: 14px;
            color: #c9184a;
            font-size: 17px;
            font-weight: bold;
            letter-spacing: 1px;
            text-align: center;
        }
        .modal-close-tip {
            margin-top: 6px;
            color: #999;
            font-size: 12px;
        }

        /* 底部提示 */
        #tip {
            position: fixed;
            bottom: 18px;
            width: 100%;
            text-align: center;
            color: rgba(255, 182, 193, 0.7);
            font-size: 12px;
            letter-spacing: 1px;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 0 8px rgba(255, 42, 109, 0.6);
        }
    </style>
</head>
<body>

    <!-- 1. 开场引导遮罩 -->
    <div id="welcome-overlay">
        <div class="pulse-heart">❤️</div>
        <div class="welcome-title">致 孔文丽</div>
        <div class="welcome-sub">✨ 点击屏幕开启专属星河与音乐 ✨</div>
    </div>

    <!-- 2. 音乐开关按钮 -->
    <div id="music-btn" title="点击切换背景音乐">🎵</div>
    <audio id="bgm" loop preload="auto"></audio>

    <!-- 3. 照片放大预览弹窗 -->
    <div id="photo-modal">
        <div class="modal-card">
            <img id="modal-img" src="" alt="专属回忆">
            <div class="modal-caption" id="modal-caption"></div>
            <div class="modal-close-tip">点击任意处关闭</div>
        </div>
    </div>

    <div id="tip">✨ 手机拖动旋转 · 滚轮缩放 · 点击悬浮照片卡可放大查看 ✨</div>

    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ================= 🌟 自定义专属表白配置区 🌟 =================
        const CONFIG = {
            centerTitle: "To 孔文丽 ❤️", // 爱心正中央名字

            // 背景音乐：可填同目录下的音频文件（如 "bgm.mp3"）。留空或加载失败时会自动启用内置浪漫八音盒合成器！
            bgmUrl: "bgm.mp3",

            // 6张拍立得照片配置：
            // 将你的照片依次命名为 1.jpg, 2.jpg, 3.jpg, 4.jpg, 5.jpg, 6.jpg 放入同级文件夹。
            // 如果某张图片还没放，系统会自动生成浪漫主题渐变卡片，绝不会黑屏！
            photos: [
                { url: "1.jpg", caption: "初见你的那天 ✨", theme: ["#ff758c", "#ff7eb3"], icon: "🌸" },
                { url: "2.jpg", caption: "一起看过的日落 🌇", theme: ["#f6d365", "#fda085"], icon: "🌇" },
                { url: "3.jpg", caption: "最甜的笑容 😊", theme: ["#a18cd1", "#fbc2eb"], icon: "🍬" },
                { url: "4.jpg", caption: "陪你走过的四季 🍂", theme: ["#84fab0", "#8fd3f4"], icon: "🎠" },
                { url: "5.jpg", caption: "星河滚烫，你是理想 🌌", theme: ["#fccb90", "#d57eeb"], icon: "🌠" },
                { url: "6.jpg", caption: "未完待续的我们 ❤️", theme: ["#ff0844", "#ffb199"], icon: "💍" }
            ],

            floatingWords: [
                "永远偏爱你", "My Only One", "朝朝暮暮", 
                "2026.10.18", "星河滚烫，你是人间理想", 
                "喜欢你", "For You", "岁岁年年",
                "满眼都是你", "Forever Love", "陪你看完每一次日落"
            ],
            particleCount: 7000,
            bgStarCount: 1500
        };
        // =============================================================

        // ----------------- 🎵 音乐控制与八音盒兜底 -----------------
        const bgmAudio = document.getElementById('bgm');
        const musicBtn = document.getElementById('music-btn');
        let isMusicPlaying = false;
        let useSynthFallback = false;
        let audioCtx = null;
        let synthTimer = null;

        if (CONFIG.bgmUrl) {
            bgmAudio.src = CONFIG.bgmUrl;
            bgmAudio.addEventListener('error', () => { useSynthFallback = true; });
        } else {
            useSynthFallback = true;
        }

        const MELODY_NOTES = [523.25, 659.25, 783.99, 1046.50, 783.99, 659.25, 587.33, 698.46, 880.00, 1174.66];
        let noteIndex = 0;

        function playMusicBoxNote(freq) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.12, audioCtx.currentTime + 0.04);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 1.45);
        }

        function startBGM() {
            if (isMusicPlaying) return;
            if (!useSynthFallback) {
                bgmAudio.play().then(() => {
                    isMusicPlaying = true;
                    musicBtn.classList.add('playing');
                }).catch(() => {
                    useSynthFallback = true;
                    isMusicPlaying = true;
                    musicBtn.classList.add('playing');
                    startSynth();
                });
            } else {
                isMusicPlaying = true;
                musicBtn.classList.add('playing');
                startSynth();
            }
        }

        function startSynth() {
            if (synthTimer) return;
            synthTimer = setInterval(() => {
                if (isMusicPlaying) {
                    playMusicBoxNote(MELODY_NOTES[noteIndex % MELODY_NOTES.length]);
                    noteIndex++;
                }
            }, 450);
        }

        musicBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (isMusicPlaying) {
                isMusicPlaying = false;
                musicBtn.classList.remove('playing');
                if (!useSynthFallback) bgmAudio.pause();
                else if (synthTimer) { clearInterval(synthTimer); synthTimer = null; }
            } else {
                startBGM();
            }
        });

        document.getElementById('welcome-overlay').addEventListener('click', () => {
            document.getElementById('welcome-overlay').classList.add('hidden');
            startBGM();
        });

        // ----------------- 🌌 3D 核心场景初始化 -----------------
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = window.innerWidth < window.innerHeight ? 90 : 60;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const worldGroup = new THREE.Group();
        scene.add(worldGroup);

        const heartGroup = new THREE.Group();
        worldGroup.add(heartGroup);

        function createGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
            grad.addColorStop(0.3, 'rgba(255, 120, 160, 0.8)');
            grad.addColorStop(0.7, 'rgba(255, 30, 90, 0.25)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }
        const particleTexture = createGlowTexture();

        // 1. 3D 粒子爱心
        const positions = new Float32Array(CONFIG.particleCount * 3);
        const basePositions = new Float32Array(CONFIG.particleCount * 3);
        const colors = new Float32Array(CONFIG.particleCount * 3);
        const randomPhases = new Float32Array(CONFIG.particleCount);
        const colorInside = new THREE.Color('#ff1e56');
        const colorOutside = new THREE.Color('#ffaccc');

        for (let i = 0; i < CONFIG.particleCount; i++) {
            const t = Math.random() * Math.PI * 2;
            const r = Math.pow(Math.random(), 0.38);
            let x = 16 * Math.pow(Math.sin(t), 3) * r;
            let y = (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * r;
            let z = (Math.random() - 0.5) * 14 * Math.sqrt(Math.max(0, 1 - r * r * 0.85));
            if (Math.random() < 0.12) { x *= 1.2; y *= 1.2; z *= 1.2; }
            positions[i*3] = x; positions[i*3+1] = y; positions[i*3+2] = z;
            basePositions[i*3] = x; basePositions[i*3+1] = y; basePositions[i*3+2] = z;
            randomPhases[i] = Math.random() * Math.PI * 2;
            const mixedColor = colorInside.clone().lerp(colorOutside, Math.random() * r);
            colors[i*3] = mixedColor.r; colors[i*3+1] = mixedColor.g; colors[i*3+2] = mixedColor.b;
        }

        const heartGeo = new THREE.BufferGeometry();
        heartGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        heartGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        const heartPoints = new THREE.Points(heartGeo, new THREE.PointsMaterial({
            size: 0.9, map: particleTexture, vertexColors: true, transparent: true, opacity: 0.9, depthWrite: false, blending: THREE.AdditiveBlending
        }));
        heartGroup.add(heartPoints);

        // 2. 3D 文字精灵
        function createTextSprite(text, fontSize = 36, color = '#ffd1dc', scale = 12) {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.font = `bold ${fontSize}px "Microsoft YaHei", sans-serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.shadowColor = '#ff2a6d'; ctx.shadowBlur = 16;
            ctx.fillStyle = color;
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), transparent: true, depthWrite: false }));
            sprite.scale.set(scale, scale * 0.25, 1);
            return sprite;
        }

        const centerSprite = createTextSprite(CONFIG.centerTitle, 46, '#ffffff', 16);
        centerSprite.position.set(0, 1.5, 0);
        heartGroup.add(centerSprite);

        const wordSprites = [];
        CONFIG.floatingWords.forEach((word, idx) => {
            const sprite = createTextSprite(word, 30, '#ffb3c6', 12.5);
            const angle = (idx / CONFIG.floatingWords.length) * Math.PI * 2;
            sprite.userData = { angle: angle, radius: 24 + Math.random() * 10, yOffset: (Math.random() - 0.5) * 25, speed: 0.002 + Math.random() * 0.002 };
            worldGroup.add(sprite);
            wordSprites.push(sprite);
        });

        // ----------------- 📸 3. 3D 拍立得照片卡片环绕 -----------------
        const photoMeshes = [];
        const cardGeo = new THREE.PlaneGeometry(7.5, 9.0);

        function createPolaroidTexture(item, callback) {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 620;
            const ctx = canvas.getContext('2d');

            function draw(img) {
                ctx.clearRect(0, 0, 512, 620);
                // 拍立得相框背景
                ctx.fillStyle = '#fff6f9';
                ctx.strokeStyle = '#ff85a2';
                ctx.lineWidth = 10;
                ctx.beginPath(); ctx.roundRect(16, 16, 480, 588, 22); ctx.fill(); ctx.stroke();

                ctx.save();
                ctx.beginPath(); ctx.roundRect(42, 42, 428, 428, 10); ctx.clip();
                if (img) {
                    const sz = Math.min(img.width, img.height);
                    ctx.drawImage(img, (img.width-sz)/2, (img.height-sz)/2, sz, sz, 42, 42, 428, 428);
                } else {
                    const grad = ctx.createLinearGradient(42, 42, 470, 470);
                    grad.addColorStop(0, item.theme[0]); grad.addColorStop(1, item.theme[1]);
                    ctx.fillStyle = grad; ctx.fillRect(42, 42, 428, 428);
                    ctx.font = '110px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillStyle = '#fff'; ctx.fillText(item.icon, 256, 256);
                }
                ctx.restore();

                // 底部签名
                ctx.fillStyle = '#c9184a'; ctx.font = 'bold 28px "Microsoft YaHei", sans-serif';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(item.caption, 256, 535);

                const tex = new THREE.CanvasTexture(canvas);
                tex.needsUpdate = true;
                callback(tex, canvas.toDataURL('image/png'));
            }

            draw(null);
            if (item.url) {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => draw(img);
                img.src = item.url;
            }
        }

        CONFIG.photos.forEach((item, idx) => {
            const mat = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide, transparent: true, opacity: 0.95 });
            const mesh = new THREE.Mesh(cardGeo, mat);
            const angle = (idx / CONFIG.photos.length) * Math.PI * 2;
            mesh.userData = {
                angle: angle, radius: 31, yOffset: ((idx % 3) - 1) * 10,
                orbitSpeed: 0.0018, phase: idx * 1.2, caption: item.caption, previewDataUrl: ''
            };
            createPolaroidTexture(item, (tex, dataUrl) => {
                mat.map = tex; mat.needsUpdate = true;
                mesh.userData.previewDataUrl = dataUrl;
            });
            worldGroup.add(mesh);
            photoMeshes.push(mesh);
        });

        // 4. 背景星空
        const bgGeo = new THREE.BufferGeometry();
        const bgPos = new Float32Array(CONFIG.bgStarCount * 3);
        for (let i = 0; i < CONFIG.bgStarCount * 3; i++) bgPos[i] = (Math.random() - 0.5) * 180;
        bgGeo.setAttribute('position', new THREE.BufferAttribute(bgPos, 3));
        worldGroup.add(new THREE.Points(bgGeo, new THREE.PointsMaterial({
            size: 0.75, map: particleTexture, color: 0xffb6c1, transparent: true, opacity: 0.45, depthWrite: false, blending: THREE.AdditiveBlending
        })));

        // ----------------- 🖱️ 互动事件：拖拽 + 点击照片放大 -----------------
        let isDragging = false, pDown = {x:0, y:0}, prevX = 0, prevY = 0;
        let targetRotX = 0.08, targetRotY = 0;
        const raycaster = new THREE.Raycaster(), mouse = new THREE.Vector2();
        const modal = document.getElementById('photo-modal');

        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('#welcome-overlay') || e.target.closest('#music-btn') || e.target.closest('#photo-modal')) return;
            isDragging = true; prevX = e.clientX; prevY = e.clientY; pDown = {x: e.clientX, y: e.clientY};
        });
        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            targetRotY += (e.clientX - prevX) * 0.007;
            targetRotX = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, targetRotX + (e.clientY - prevY) * 0.007));
            prevX = e.clientX; prevY = e.clientY;
        });
        window.addEventListener('pointerup', (e) => {
            if (!isDragging) return; isDragging = false;
            if (Math.hypot(e.clientX - pDown.x, e.clientY - pDown.y) < 6) {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const hits = raycaster.intersectObjects(photoMeshes);
                if (hits.length > 0) {
                    document.getElementById('modal-img').src = hits[0].object.userData.previewDataUrl;
                    document.getElementById('modal-caption').textContent = hits[0].object.userData.caption;
                    modal.classList.add('active');
                }
            }
        });
        modal.addEventListener('click', () => modal.classList.remove('active'));

        window.addEventListener('wheel', (e) => {
            camera.position.z = Math.max(30, Math.min(110, camera.position.z + e.deltaY * 0.035));
        });

        // ----------------- ✨ 动画渲染 -----------------
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const elapsed = clock.getElapsedTime();

            const beat = Math.pow(Math.sin(elapsed * 3.2), 63) * 0.22 + Math.sin(elapsed * 3.2 + 1.5) * 0.05;
            const scale = 1 + beat;
            const posAttr = heartGeo.attributes.position;
            for (let i = 0; i < CONFIG.particleCount; i++) {
                const bx = basePositions[i*3], by = basePositions[i*3+1], bz = basePositions[i*3+2];
                const wave = 1 + Math.sin(elapsed * 2.5 + randomPhases[i]) * 0.03;
                posAttr.array[i*3] = bx * scale * wave;
                posAttr.array[i*3+1] = by * scale * wave;
                posAttr.array[i*3+2] = bz * scale * wave;
            }
            posAttr.needsUpdate = true;

            wordSprites.forEach(s => {
                s.userData.angle += s.userData.speed;
                s.position.x = Math.cos(s.userData.angle) * s.userData.radius;
                s.position.z = Math.sin(s.userData.angle) * s.userData.radius;
                s.position.y = s.userData.yOffset + Math.sin(elapsed * 1.5 + s.userData.angle) * 1.5;
            });

            photoMeshes.forEach(mesh => {
                const ud = mesh.userData;
                ud.angle += ud.orbitSpeed;
                mesh.position.x = Math.cos(ud.angle) * ud.radius;
                mesh.position.z = Math.sin(ud.angle) * ud.radius;
                mesh.position.y = ud.yOffset + Math.sin(elapsed * 1.4 + ud.phase) * 2.0;
                mesh.rotation.y = -ud.angle + Math.PI / 2 + Math.sin(elapsed * 0.9 + ud.phase) * 0.3;
                mesh.rotation.x = Math.sin(elapsed * 1.1 + ud.phase) * 0.1;
            });

            if (!isDragging && !modal.classList.contains('active')) targetRotY += 0.0022;
            worldGroup.rotation.y += (targetRotY - worldGroup.rotation.y) * 0.08;
            worldGroup.rotation.x += (targetRotX - worldGroup.rotation.x) * 0.08;

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.position.z = window.innerWidth < window.innerHeight ? 90 : 60;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
